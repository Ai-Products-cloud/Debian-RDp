
name: Linux Full Desktop RDP

on:
  workflow_dispatch:

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:

      # 1. Install Desktop Environment
      - name: Install LXQt and XRDP
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxqt \
            lxqt-core \
            lxqt-session \
            openbox \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            x11-xserver-utils \
            curl \
            netcat-openbsd

          echo "LXQt installation completed."

      # 2. Create RDP User
      - name: Create RDP User
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -e

          if [ -z "$RDP_USERNAME" ] || [ -z "$RDP_PASSWORD" ]; then
            echo "Missing RDP credentials."
            exit 1
          fi

          if ! id "$RDP_USERNAME" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$RDP_USERNAME"
          fi

          printf '%s:%s\n' "$RDP_USERNAME" "$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo,ssl-cert "$RDP_USERNAME"

          sudo mkdir -p "/home/$RDP_USERNAME/.cache"

          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME"

          echo "RDP_USERNAME=$RDP_USERNAME" >> "$GITHUB_ENV"

      # 3. Configure LXQt Session
      - name: Configure LXQt
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -e

          sudo tee "/home/$RDP_USERNAME/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_SESSION_TYPE=x11
          export XDG_CONFIG_DIRS=/etc/xdg

          exec dbus-launch --exit-with-session startlxqt
          EOF

          sudo chmod 755 "/home/$RDP_USERNAME/.xsession"

          sudo chown "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/.xsession"

          sudo rm -rf "/home/$RDP_USERNAME/.cache/sessions"

          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME"

          echo "LXQt session configured."

      # 4. Configure XRDP
      - name: Configure XRDP
        run: |
          set -e

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp

          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl status xrdp --no-pager

      # 5. Install Tailscale
      - name: Install Tailscale
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Tailscale installed."

      # 6. Connect Tailscale
      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "Missing Tailscale authentication key."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=github-linux-desktop

          sleep 10

          IP=$(tailscale ip -4)

          if [ -z "$IP" ]; then
            echo "Tailscale IP not found."
            exit 1
          fi

          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"

          echo "Tailscale connected."

      # 7. Verify Desktop and RDP
      - name: Verify Desktop
        run: |
          set -e

          echo "Checking LXQt..."

          command -v startlxqt

          echo "Checking XRDP..."

          if ! sudo systemctl is-active --quiet xrdp; then
            sudo journalctl -u xrdp -n 50 --no-pager
            exit 1
          fi

          echo "Checking port 3389..."

          if ! sudo ss -tlnp | grep -q ':3389'; then
            echo "XRDP port is not listening."
            exit 1
          fi

          echo "Desktop and RDP services are ready."

      # 8. Diagnostics
      - name: Desktop Diagnostics
        if: always()
        run: |
          echo "===== XRDP STATUS ====="

          sudo systemctl status xrdp --no-pager || true

          echo "===== XRDP LOGS ====="

          sudo journalctl -u xrdp -n 60 --no-pager || true

          echo "===== XRDP SESSION LOG ====="

          sudo tail -n 60 /var/log/xrdp-sesman.log || true

          echo "===== LXQT SESSION ====="

          cat "/home/$RDP_USERNAME/.xsession" || true

          echo "===== SESSION ERRORS ====="

          sudo cat "/home/$RDP_USERNAME/.xsession-errors" \
            2>/dev/null || true

      # 9. Keep Runner Alive
      - name: Maintain Connection
        run: |
          echo ""
          echo "================================"
          echo "      LINUX DESKTOP READY"
          echo "================================"
          echo "Address : $TAILSCALE_IP"
          echo "Port    : 3389"
          echo "Username: $RDP_USERNAME"
          echo "Password: Your GitHub Secret"
          echo "Desktop : LXQt"
          echo "================================"

          while true; do

            echo "[$(date)] Linux Desktop Running"

            tailscale status

            if ! sudo systemctl is-active --quiet xrdp; then
              echo "Restarting XRDP..."
              sudo systemctl restart xrdp
            fi

            sleep 60

          done
